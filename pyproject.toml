[project]
name = "memory-os"
version = "0.2.0"
description = "Git-native Memory & Deterministic Verification Control Plane for AI Coding Agents (Claude Code, Cursor, Codex)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "ai-agents",
    "mcp",
    "memory",
    "claude-code",
    "cursor",
    "codex",
    "ci-cd",
    "verification",
    "sqlite-fts5",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/memory-os/memory-os"
Repository = "https://github.com/memory-os/memory-os"
Issues = "https://github.com/memory-os/memory-os/issues"

[project.scripts]
memory_os = "memory_os.cli:main"
memory-os = "memory_os.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp"]
providers-ollama = ["ollama>=0.1.0"]
providers-openai = ["openai>=1.0.0"]
resource-psutil = ["psutil>=5.9.0"]
validation-pydantic = ["pydantic>=2.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_os", "memory_os.*"]
